<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil - Berlly Boutique</title>
    <link rel="stylesheet" href="css/auth.css">
    <script src="js/gate.js"></script>
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <h1>Berlly Boutique</h1>
                <p>Mon profil</p>
            </div>

            <h2>Mes informations</h2>

            <form id="profile-form">

                <div class="form-group">
                    <label for="profile-name">Nom complet</label>
                    <input type="text" id="profile-name" required>
                </div>

                <div class="form-group">
                    <label for="profile-email">Adresse e-mail</label>
                    <input type="email" id="profile-email" disabled>
                </div>

                <div class="form-group">
                    <label for="profile-phone">Téléphone</label>
                    <input type="tel" id="profile-phone">
                </div>

                <button type="submit" class="auth-btn">
                    Enregistrer les modifications
                </button>

            </form>

            <p class="auth-message" id="profile-message"></p>

            <div class="auth-footer">

                <p>
                    <a href="#" onclick="logout(); return false;">
                        Se déconnecter
                    </a>
                </p>

                <p>
                    <a href="index.html">← Retour à la boutique</a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
