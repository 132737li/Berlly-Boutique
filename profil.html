<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nouveau mot de passe - Berlly Boutique</title>

    <link rel="stylesheet" href="css/auth.css">
    <script src="js/gate.js"></script>

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">

                <h1>Berlly Boutique</h1>

                <p>Réinitialisation</p>

            </div>

            <h2>Nouveau mot de passe</h2>

            <form id="reset-form">

                <div class="form-group">

                    <label for="reset-password">
                        Nouveau mot de passe
                    </label>

                    <div class="password-box">

                        <input type="password" id="reset-password" placeholder="Nouveau mot de passe" required>

                        <button type="button" class="show-password" onclick="togglePassword('reset-password', this)">
                            👁
                        </button>

                    </div>

                    <div class="password-strength">

                        <div id="reset-strength-bar"></div>

                    </div>

                    <p id="reset-strength-text">
                        Force du mot de passe
                    </p>

                </div>

                <button type="button" class="generate-btn" onclick="generatePassword('reset-password')">
                    🔐 Générer un mot de passe sécurisé
                </button>

                <div class="form-group">

                    <label for="reset-confirm">
                        Confirmer le nouveau mot de passe
                    </label>

                    <div class="password-box">

                        <input type="password" id="reset-confirm" placeholder="Confirmer le mot de passe" required>

                        <button type="button" class="show-password" onclick="togglePassword('reset-confirm', this)">
                            👁
                        </button>

                    </div>

                </div>

                <button type="submit" class="auth-btn">
                    Modifier le mot de passe
                </button>

            </form>

            <p class="auth-message" id="reset-message"></p>

            <div class="auth-footer">

                <p>
                    <a href="connexion.html">
                        ← Retour à la connexion
                    </a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
