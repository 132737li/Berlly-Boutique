<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer un compte - Berlly Boutique</title>

    <link rel="stylesheet" href="css/auth.css">
    <script src="js/gate.js"></script>
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <h1>Berlly Boutique</h1>
                <p>Créer votre compte</p>
            </div>

            <h2>Inscription</h2>

            <form id="register-form">

                <div class="form-group">
                    <label for="register-name">Nom complet</label>

                    <input type="text" id="register-name" placeholder="Votre nom complet" required>
                </div>

                <div class="form-group">
                    <label for="register-email">Adresse e-mail</label>

                    <input type="email" id="register-email" placeholder="exemple@email.com" required>
                </div>

                <div class="form-group">
                    <label for="register-phone">Téléphone</label>

                    <input type="tel" id="register-phone" placeholder="Votre numéro de téléphone" required>
                </div>

                <div class="form-group">

                    <label for="register-password">
                        Mot de passe
                    </label>

                    <div class="password-box">

                        <input type="password" id="register-password" placeholder="Créer un mot de passe" required>

                        <button type="button" class="show-password" onclick="togglePassword('register-password', this)">
                            👁
                        </button>

                    </div>

                    <div class="password-strength">
                        <div id="strength-bar"></div>
                    </div>

                    <p id="strength-text">
                        Force du mot de passe
                    </p>

                </div>

                <button type="button" class="generate-btn" onclick="generatePassword('register-password')">
                    🔐 Générer un mot de passe sécurisé
                </button>

                <div class="form-group">

                    <label for="register-confirm">
                        Confirmer le mot de passe
                    </label>

                    <div class="password-box">

                        <input type="password" id="register-confirm" placeholder="Confirmer le mot de passe" required>

                        <button type="button" class="show-password" onclick="togglePassword('register-confirm', this)">
                            👁
                        </button>

                    </div>

                </div>

                <label class="terms">

                    <input type="checkbox" id="register-terms" required>

                    J'accepte les conditions d'utilisation.

                </label>

                <button type="submit" class="auth-btn">
                    Créer mon compte
                </button>

            </form>

            <p class="auth-message" id="register-message"></p>

            <div class="auth-footer">

                <p>
                    Vous avez déjà un compte ?
                    <a href="connexion.html">Se connecter</a>
                </p>

                <p>
                    <a href="index.html">← Retour à la boutique</a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
