<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berlly Boutique - Administration</title>

    <link rel="stylesheet" href="css/admin.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="../js/gate.js"></script>
</head>

<body class="login-page">

    <div class="login-container">

        <div class="login-logo">
            <i class="fa-solid fa-store"></i>
        </div>

        <h1>Berlly Boutique</h1>

        <p class="login-subtitle">
            Espace administrateur
        </p>

        <form id="admin-login-form">

            <div class="input-group">
                <label for="admin-username">
                    <i class="fa-solid fa-user"></i>
                    Nom d'utilisateur
                </label>

                <input type="text" id="admin-username" placeholder="Nom d'utilisateur" required>
            </div>

            <div class="input-group">
                <label for="admin-password">
                    <i class="fa-solid fa-lock"></i>
                    Mot de passe
                </label>

                <input type="password" id="admin-password" placeholder="Mot de passe" required>
            </div>

            <button type="submit" class="login-button">
                <i class="fa-solid fa-right-to-bracket"></i>
                Se connecter
            </button>

            <p id="login-error" class="login-error"></p>

        </form>

        <a href="../index.html" class="back-site">
            <i class="fa-solid fa-arrow-left"></i>
            Retour au site
        </a>

    </div>

    <script src="js/admin.js"></script>

</body>

</html>
