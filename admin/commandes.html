<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Berlly Boutique - Commandes</title>

    <link rel="stylesheet" href="css/admin.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="/..js/gate.js"></script>
</head>

<body>

    <div class="admin-layout">

        <!-- MENU ADMIN -->

        <aside class="sidebar">

            <div class="admin-logo">
                <i class="fa-solid fa-store"></i>
                <span>Berlly Boutique</span>
            </div>

            <nav>

                <a href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Tableau de bord
                </a>

                <a href="commandes.html" class="active">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Commandes
                </a>

                <a href="../index.html">
                    <i class="fa-solid fa-globe"></i>
                    Voir le site
                </a>

                <button id="logout-button" class="logout-button">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Déconnexion
                </button>

            </nav>

        </aside>


        <!-- CONTENU -->

        <main class="admin-main">

            <header class="admin-header">

                <div>

                    <h1>Historique des commandes</h1>

                    <p>
                        Consultez et gérez les commandes des clients.
                    </p>

                </div>

            </header>


            <!-- RECHERCHE -->

            <section class="orders-tools">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input type="text" id="order-search" placeholder="Rechercher une commande...">

                </div>


                <select id="status-filter">

                    <option value="all">
                        Tous les statuts
                    </option>

                    <option value="En attente">
                        En attente
                    </option>

                    <option value="Confirmée">
                        Confirmée
                    </option>

                    <option value="Livrée">
                        Livrée
                    </option>

                    <option value="Annulée">
                        Annulée
                    </option>

                </select>

            </section>


            <!-- TABLEAU -->

            <section class="admin-section">

                <div class="table-container">

                    <table>

                        <thead>

                            <tr>

                                <th>ID</th>
                                <th>Client</th>
                                <th>Téléphone</th>
                                <th>Adresse</th>
                                <th>Total</th>
                                <th>Paiement</th>
                                <th>Date</th>
                                <th>Statut</th>
                                <th>Actions</th>

                            </tr>

                        </thead>

                        <tbody id="orders-table">

                        </tbody>

                    </table>

                </div>

            </section>


            <!-- FENÊTRE DÉTAILS -->

            <div id="order-modal" class="modal">

                <div class="modal-content">

                    <button id="close-modal" class="close-modal">
                        <i class="fa-solid fa-xmark"></i>
                    </button>

                    <h2>Détails de la commande</h2>

                    <div id="order-details"></div>

                </div>

            </div>

        </main>

    </div>


    <script src="js/admin.js"></script>

</body>

</html>
