<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mot de passe oublié - Berlly Boutique</title>

    <link rel="stylesheet" href="css/auth.css">
    <script src="js/gate.js"></script>

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">

                <h1>Berlly Boutique</h1>

                <p>Récupération du compte</p>

            </div>


            <h2>Mot de passe oublié</h2>


            <p class="auth-description">
                Entrez votre adresse e-mail pour réinitialiser
                votre mot de passe.
            </p>


            <form id="forgot-form">

                <div class="form-group">

                    <label for="forgot-email">
                        Adresse e-mail
                    </label>

                    <input type="email" id="forgot-email" placeholder="Votre adresse e-mail" required>

                </div>


                <button type="submit" class="auth-btn">
                    Continuer
                </button>

            </form>


            <p class="auth-message" id="forgot-message"></p>


            <div class="auth-footer">

                <p>

                    <a href="connexion.html">
                        ← Retour à la connexion
                    </a>

                </p>

                <p>

                    Vous n'avez pas encore de compte ?

                    <a href="inscription.html">
                        Créer un compte
                    </a>

                </p>

                <p>

                    <a href="index.html">
                        ← Retour à la boutique
                    </a>

                </p>

            </div>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>

</html>
